name: Adds all issues to project board
on:
  issues:
    types:
      - opened
  pull_request_target: # safe here because the workflow doesn't check out or run any code from the PR
    types: 
      - opened
jobs: # Please don't add a checkout step to this workflow.
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.1
        with:
          project-url: https://github.com/orgs/Edirom/projects/4
          github-token: ${{ secrets.ADD_TO_PROJECT_TOKEN }}
