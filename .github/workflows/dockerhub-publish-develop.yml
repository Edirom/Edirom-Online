name: Docker Build and Push (develop)

on:
  push:
    tags: [ v** ]
    branches: [ ftr/publish-dev-to-dockerhub ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ ftr/publish-dev-to-dockerhub ]

jobs:
  
  build-test-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch all history to include latest tags for build metadata
          submodules: 'recursive'

      - name: Create Docker Hub repository if necessary
        if: github.event_name == 'push' && github.ref == 'refs/heads/ftr/publish-dev-to-dockerhub'
        env:
          DOCKER_USER: vifebot
          DOCKER_TOKEN: ${{ secrets.VIFEBOT_DOCKERHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "$DOCKER_USER:$DOCKER_TOKEN" \
            https://hub.docker.com/v2/repositories/edirom/edirom-online/)

          if [ "$STATUS" = "404" ]; then
            echo "Creating Docker Hub repository..."
            curl -fsS -X POST \
              -u "$DOCKER_USER:$DOCKER_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"namespace":"edirom","name":"edirom-online","is_private":false}' \
              https://hub.docker.com/v2/repositories/
          elif [ "$STATUS" = "200" ]; then
            echo "Repository already exists."
          else
            echo "Docker Hub API returned HTTP $STATUS"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/ftr/publish-dev-to-dockerhub' 
        uses: docker/login-action@v4
        with:
          username: vifebot
          password: ${{ secrets.VIFEBOT_DOCKERHUB_TOKEN }}
     
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: edirom/edirom-online
          tags: |
            type=raw,value=dev

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/ftr/publish-dev-to-dockerhub'
        with:
          context: .
          file: .github/workflows/Dockerfile.develop
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}