name: Docker Build and Push (develop)

on:
  push:
    tags: [ v** ]
    branches: [ develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ develop ]

jobs:
  
  build-test-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch all history to include latest tags for build metadata
          submodules: 'recursive'
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v4
        with:
          username: vifebot
          password: ${{ secrets.VIFEBOT_DOCKERHUB_TOKEN }}
     
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: edirom/edirom-online
          tags: |
            type=raw,value=dev

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          context: .
          file: .github/workflows/Dockerfile.develop
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}