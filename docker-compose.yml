services:
  edirom-online-backend:
    container_name: eXist-db
    build:
      # location and name of backend Dockerfile
      context: ./backend   
      dockerfile: Dockerfile
      args:
        SOURCE: ${BE_REPO:-https://github.com/Edirom/Edirom-Online-Backend.git}
        BRANCH: ${BE_BRANCH:-v1.5.0}
        EDITION: ${EDITION_XAR}
    ports:
      # expose eXist-db
      - "${BE_PORT:-8080}:8080"
  edirom-online-frontend:
    container_name: nginx
    build:
      # location and name of frontend
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SOURCE: ${FE_REPO:-https://github.com/Edirom/Edirom-Online-Frontend.git}
        BRANCH: ${FE_BRANCH:-v1.5.0}
        # Backend port for frontend configuration
        BE_PORT: ${BE_PORT:-8080}
        # WebSocket server URL for frontend configuration (empty = WebSocket features disabled)
        WS_URL: ${WS_URL:-}
        SENCHA_BUILD_ENV: ${SENCHA_BUILD_ENV:-production}
    ports:
      # expose nginx
      - "${FE_PORT:-8089}:80"
  digilib:
    container_name: digilib
    profiles: ["digilib"]
    image: stadlerpeter/digilib-docker
    volumes:
      # Every folder in IMAGES_DIR gets its own manifest:
      #   IMAGES_DIR itself → http://localhost:8182/Manifester/IIIF/3
      #   IMAGES_DIR/<sub>  → http://localhost:8182/Manifester/IIIF/3/<sub>
      - ${IMAGES_DIR:-./images}:/var/lib/digilib/images:ro
    ports:
      - "8182:8080"
  cartographer:
    container_name: cartographer
    profiles: ["cartographer"]
    image: ghcr.io/edirom/cartographer-app:${CARTOGRAPHER_VERSION:-2.0.0}
    environment:
      APP_PUBLIC_PATH: /
    ports:
      - "${CARTOGRAPHER_PORT:-8081}:80"