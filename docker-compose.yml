services:
  edirom-online-backend:
    container_name: eXist-db
    build:
      # location and name of backend Dockerfile
      context: ./backend   
      dockerfile: Dockerfile
      args:
        SOURCE: ${BE_REPO:-https://github.com/Edirom/Edirom-Online-Backend.git}
        BRANCH: ${BE_BRANCH:-v1.5.0}
        EDITION: ${EDITION_XAR}
    ports:
      # expose eXist-db
      - "${BE_PORT:-8080}:8080"
  edirom-online-frontend:
    container_name: nginx
    build:
      # location and name of frontend
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SOURCE: ${FE_REPO:-https://github.com/Edirom/Edirom-Online-Frontend.git}
        BRANCH: ${FE_BRANCH:-v1.5.0}
        # Backend port for frontend configuration
        BE_PORT: ${BE_PORT:-8080}
        # WebSocket server URL for frontend configuration (empty = WebSocket features disabled)
        WS_URL: ${WS_URL:-}
        SENCHA_BUILD_ENV: ${SENCHA_BUILD_ENV:-production}
    ports:
      # expose nginx
      - "${FE_PORT:-8089}:80"
  digilib:
    container_name: digilib
    profiles: ["digilib"]
    image: robcast/digilib:release-2.13.0
    environment:
      BASEDIR_LIST: /images
      # Must be non-empty, otherwise digilib's info.json generation crashes.
      IIIF_IMAGE_BASE_URL: http://localhost:8182/digilib/Scaler/IIIF
      IIIF_MANIFEST_BASE_URL: http://localhost:8182/digilib/Manifester/IIIF
    volumes:
      # Mounted as a named subdir so the manifest identifier is stable ("source").
      - ${IMAGES_DIR:-./images}:/images/source:ro
    ports:
      # images:   http://localhost:8182/digilib/Scaler/IIIF/3/source!<file name>/full/max/0/default.jpg
      # manifest: http://localhost:8182/digilib/Manifester/IIIF/3/source
      - "8182:8080"

  cartographer:
    container_name: cartographer
    profiles: ["cartographer"]
    image: ghcr.io/edirom/cartographer-app:${CARTOGRAPHER_VERSION:-2.0.0}
    environment:
      APP_PUBLIC_PATH: /
    ports:
      - "${CARTOGRAPHER_PORT:-8081}:80"