# Docker Compose configuration for Edirom Online
#
# Usage:
#   Default (remote sources): docker compose --profile default up
#   Local backend development: export BE_LOCAL_SOURCE=/path/to/backend && docker compose --profile local-backend up
#     (starts: local backend + regular frontend)
#   Local frontend development: export FE_LOCAL_SOURCE=/path/to/frontend && docker compose --profile local-frontend up
#     (starts: regular backend + local frontend)
#   Both local: export BE_LOCAL_SOURCE=/path && export FE_LOCAL_SOURCE=/path && docker compose --profile local-fullstack up
#
services:
  edirom-online-backend:
    container_name: eXist-db
    build:
      # location and name of backend Dockerfile
      context: ./backend
      dockerfile: Dockerfile
      args:
        SOURCE: ${BE_REPO:-https://github.com/Edirom/Edirom-Online-Backend.git}
        BRANCH: ${BE_BRANCH:-v1.4.0}
        EDITION: ${EDITION_XAR}
    # Note: depends_on only controls runtime startup order, not build-time dependencies.
    # Builder image must be built explicitly first: docker compose build edirom-online-builder
    # See: https://docs.docker.com/compose/compose-file/05-services/#depends_on
    # depends_on:
    #  - edirom-online-builder
    ports:
      # expose eXist-db
      - "${BE_PORT:-8080}:8080"
    profiles:
      - default
      - local-frontend

  edirom-online-frontend:
    container_name: nginx
    build:
      # location and name of frontend
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SOURCE: ${FE_REPO:-https://github.com/Edirom/Edirom-Online-Frontend.git}
        BRANCH: ${FE_BRANCH:-v1.4.0}
        # Backend port for frontend configuration
        BE_PORT: ${BE_PORT:-8080}
        SENCHA_BUILD_ENV: ${SENCHA_BUILD_ENV:-production}
    # Note: depends_on only controls runtime startup order, not build-time dependencies.
    # Builder image must be built explicitly first: docker compose build edirom-online-builder
    # See: https://docs.docker.com/compose/compose-file/05-services/#depends_on
    # depends_on:
    #  - edirom-online-builder
    ports:
      # expose nginx
      - "${FE_PORT:-8089}:80"
    profiles:
      - default
      - local-backend

  # Shared builder service - to be built before compose up
  edirom-online-builder:
    build:
      context: ./builder
      dockerfile: Dockerfile
    image: edirom-online-builder:latest

  # Local backend source development configuration - use with --profile local-backend
  # Note: Use interactive-builder profile for interactive development with persistent build environment
  local-edirom-online-backend:
    container_name: local-eXist-db
    build:
      context: ${BE_LOCAL_SOURCE}
      dockerfile: ${PWD}/backend/Dockerfile.local
      additional_contexts:
        backend: ./backend
      args:
        BRANCH: ${BE_BRANCH:-develop}
        EDITION: ${EDITION_XAR}
    # Note: depends_on only controls runtime startup order, not build-time dependencies.
    # Builder image must be built explicitly first: docker compose build edirom-online-builder
    # See: https://docs.docker.com/compose/compose-file/05-services/#depends_on
    # depends_on:
    #  - edirom-online-builder
    ports:
      - "${BE_PORT:-8080}:8080"
    profiles:
      - local-backend
      - local-fullstack
    volumes:
      # Mount local clone of Edirom-Online-Backend for development
      # Usage: export BE_LOCAL_SOURCE=/path/to/local/backend && docker compose --profile local-backend up
      - type: bind
        source: ${BE_LOCAL_SOURCE}
        target: /opt/eo-backend
        bind:
          create_host_path: true

  # Local frontend source development configuration - use with --profile local-frontend
  # Note: Use interactive-builder profile for interactive development with persistent build environment
  local-edirom-online-frontend:
    container_name: local-nginx
    build:
      context: ${FE_LOCAL_SOURCE}
      dockerfile: ${PWD}/frontend/Dockerfile.local
    # Note: depends_on only controls runtime startup order, not build-time dependencies.
    # Builder image must be built explicitly first: docker compose build edirom-online-builder
    # See: https://docs.docker.com/compose/compose-file/05-services/#depends_on
    # depends_on:
    #  - edirom-online-builder
    ports:
      - "${FE_PORT:-8089}:80"
    profiles:
      - local-frontend
      - local-fullstack
    volumes:
      # Mount local clone of Edirom-Online-Frontend for development
      # Usage: export FE_LOCAL_SOURCE=/path/to/local/frontend && docker compose --profile local-frontend up
      - type: bind
        source: ${FE_LOCAL_SOURCE}
        target: /opt/eo-frontend
        bind:
          create_host_path: true

      # Mount build directory to nginx html root
      - type: bind
        source: ${FE_LOCAL_SOURCE}/build
        target: /usr/share/nginx/html/
        bind:
          create_host_path: true


  # Interactive builder service for local development - use with --profile interactive-builder
  interactive-edirom-online-builder:
    extends: edirom-online-builder
    container_name: interactive-edirom-online-builder
    stdin_open: true
    tty: true
    command: /bin/bash
    volumes:
      # Mount local clone of Edirom-Online-Frontend for development
      # Usage: export FE_LOCAL_SOURCE=/path/to/local/frontend && export BE_LOCAL_SOURCE=/path/to/local/backend && docker compose --profile interactive-builder up -d interactive-edirom-online-builder
      - type: bind
        source: ${FE_LOCAL_SOURCE}
        target: /opt/eo-frontend
        bind:
          create_host_path: true
      # Mount local clone of Edirom-Online-Backend for development (optional)
      - type: bind
        source: ${BE_LOCAL_SOURCE}
        target: /opt/eo-backend
        bind:
          create_host_path: true
    working_dir: /opt/eo-frontend
    environment:
      - BE_PORT=${BE_PORT:-8080}
    profiles:
      - interactive-builder
