services:
  edirom-online-backend:
    container_name: eXist-db
    build:
      # location and name of backend Dockerfile
      context: ./backend   
      dockerfile: Dockerfile
      args:
        SOURCE: ${BE_REPO:-https://github.com/Edirom/Edirom-Online-Backend.git}
        BRANCH: ${BE_BRANCH:-v1.5.0}
        EDITION: ${EDITION_XAR}
    ports:
      # expose eXist-db
      - "${BE_PORT:-8080}:8080"
  edirom-online-frontend:
    container_name: nginx
    build:
      # location and name of frontend
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SOURCE: ${FE_REPO:-https://github.com/Edirom/Edirom-Online-Frontend.git}
        BRANCH: ${FE_BRANCH:-v1.5.0}
        # Backend port for frontend configuration
        BE_PORT: ${BE_PORT:-8080}
        SENCHA_BUILD_ENV: ${SENCHA_BUILD_ENV:-production}
    ports:
      # expose nginx
      - "${FE_PORT:-8089}:80"
  cantaloupe:
    container_name: cantaloupe
    profiles: ["cantaloupe"]
    build:
      context: ./cantaloupe
      dockerfile: Dockerfile
    volumes:
      - ${IMAGES_DIR:-./images}:/images:ro
    environment:
      JAVA_XMX: ${CANTALOUPE_XMX:-2g}
    ports:
      - "8182:8182"   # images:   http://localhost:8182/iiif/3/<file name>
      - "8000:8000"   # manifest: http://localhost:8000/manifest.json

  cartographer:
    container_name: cartographer
    profiles: ["cartographer"]
    image: ghcr.io/edirom/cartographer-app:${CARTOGRAPHER_VERSION:-2.0.0}
    environment:
      APP_PUBLIC_PATH: /
    ports:
      - "${CARTOGRAPHER_PORT:-8081}:80"